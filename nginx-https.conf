# Тот же сертификат для Supabase: браузер не должен ходить на *.supabase.co
# напрямую. На мобильных и VPN-каналах такое соединение рвётся посреди запроса
# (ERR_CONNECTION_RESET / ERR_CERT_VERIFIER_CHANGED), и несохранённые правки
# теряются. nginx проксирует /luna-calendar-secure/sb/ в тот же проект Supabase.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP сервер — либо редирект на HTTPS, либо "отлуп"
# Локальный API (Postgres + GoTrue + PostgREST) вместо облака.
resolver 127.0.0.11 valid=10s ipv6=off;
# resolve — чтобы перезапуск контейнера не оставлял шлюз со старым IP.
upstream luna_api_upstream {
    zone luna_api_upstream 256k;
    server luna-api:80 resolve;
}

server {
    listen 80;
    server_name _;

    # Если запрос не на наш "секретный" путь — возвращаем 444 (закрываем соединение без ответа)
    # Это и есть "отлуп" для всех левых запросов
    location / {
        return 444;
    }

    # Если запрос правильный — редиректим на HTTPS с тем же путём
    # Редиректим на HTTPS с тем же путём и на ЕДИНЫЙ внешний порт стека:
    # календарь наружу публикуется не напрямую, а через nginx меню (48291).
    location /luna-calendar-secure/ {
        return 301 https://$host:48291$request_uri;
    }
}

# HTTPS сервер — обслуживаем только "секретный" путь
server {
    listen 443 ssl;
    server_name _;

    # Пути к сертификатам внутри контейнера
    ssl_certificate     /etc/nginx/certs/live/78.29.33.110.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/78.29.33.110.sslip.io/privkey.pem;
    # Современные протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Supabase через этот же домен и сертификат (REST + auth + realtime).
    # Префикс /luna-calendar-secure/sb/ отрезается, дальше — обычные пути
    # Supabase: /rest/v1/..., /auth/v1/..., /realtime/v1/...
    location ^~ /luna-calendar-secure/sb/ {
        proxy_pass http://luna_api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # TLS 1.3 из этого контейнера до Cloudflare (Supabase) висит на
        # рукопожатии: соединение устанавливается, ответ не приходит, nginx
        # пишет "upstream timed out while SSL handshaking" и "peer closed
        # connection in SSL handshake". Хост тот же запрос выполняет за 0,2 с.
        # С TLS 1.2 всё отвечает мгновенно, шифры современные, так что фиксируем
        # 1.2 и не зависим от этого поведения.
        proxy_ssl_session_reuse on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Обслуживаем только "/luna-calendar-secure/"
    # index.html НЕ кэшируем: иначе телефон неделями работает на старой сборке,
    # которая ходит в Supabase напрямую и не совпадает с остальными устройствами.
    # Хэшированные ассеты, наоборот, можно кэшировать навсегда.
    location = /luna-calendar-secure/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /luna-calendar-secure/manifest.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ^~ /luna-calendar-secure/assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /luna-calendar-secure/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /luna-calendar-secure/index.html;
    }

    # Всё остальное — закрываем соединение (отлуп)
    location / {
        return 444;
    }
}
