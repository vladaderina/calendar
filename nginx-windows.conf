# Nginx Configuration for Windows (HTTPS)
# Place in: C:\nginx\conf\nginx.conf
# Access via: https://lunxhome.tplinkdns.com/luna-calendar-secure/

worker_processes auto;
error_log C:\nginx\logs\error.log warn;
pid C:\nginx\logs\nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       C:\nginx\conf\mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log C:\nginx\logs\access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    # UPSTREAM
    upstream calendar_app {
        server 127.0.0.1:3000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # HTTP Server - Redirect to HTTPS
    server {
        listen 80;
        server_name lunxhome.tplinkdns.com;
        
        # Redirect all HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl http2;
        server_name lunxhome.tplinkdns.com;

        # SSL Configuration
        ssl_certificate C:\nginx\ssl\fullchain.pem;
        ssl_certificate_key C:\nginx\ssl\privkey.pem;
        ssl_trusted_certificate C:\nginx\ssl\chain.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # IP Whitelist - ONLY YOUR HOME IP
        allow 78.29.33.110;
        deny all;

        # Secret Endpoint - Change this path!
        location /luna-calendar-secure/ {
            # Strip the secret path prefix
            rewrite ^/luna-calendar-secure/(.*)$ /$1 break;
            
            proxy_pass http://calendar_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # All other requests return 404 (security)
        location / {
            return 404;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }

        # Error pages
        error_page 404 /404.html;
        location = /404.html {
            root C:\nginx\www;
            internal;
        }
    }
}