# Nginx Configuration for Secure Home Calendar (TP-Link DDNS Ready)
# Place in: /etc/nginx/sites-available/calendar
# Enable: ln -s /etc/nginx/sites-available/calendar /etc/nginx/sites-enabled/

# ==============================================================================
# SECURITY: OBSCURE ENDPOINT MODE
# ==============================================================================
# This configuration only allows access via a secret endpoint path.
# Normal requests to the domain return 404.
# 
# YOUR SECURITY INFO:
# - Public IP: 78.29.33.110
# - Domain: lunxhome.tplinkdns.com
# - Choose your secret endpoint path below (example: /secure-view/)
# ==============================================================================

# Rate limiting zone (define once in http block)
# Add to /etc/nginx/nginx.conf in http block:
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate:5r/m;

# UPSTREAM - Your application server
upstream calendar_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP - Return 404 for all requests (security by obscurity)
server {
    listen 80;
    listen [::]:80;
    server_name lunxhome.tplinkdns.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS - Main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lunxhome.tplinkdns.com;

    # Secret endpoint - PUT YOUR SECRET PATH HERE
    # Example: /secure-view/ or /mypassword123/
    # You MUST change this before deploying!
    location /YOUR_SECRET_ENDPOINT/ {
        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/lunxhome.tplinkdns.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lunxhome.tplinkdns.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/lunxhome.tplinkdns.com/chain.pem;
        
        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # IP Whitelist - YOUR HOME IP ONLY
        allow 78.29.33.110;    # Your current IP
        deny all;               # Block everyone else

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-DNS-Prefetch-Control "off" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Rate Limiting
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        # Access logging
        access_log /var/log/nginx/calendar.access.log;
        error_log /var/log/nginx/calendar.error.log;

        # Proxy Settings
        proxy_pass http://calendar_app;
        proxy_http_version 1.1;
        
        # WebSocket support (for Supabase realtime)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffering disabled for real-time feel
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Return 404 for any other path (security by obscurity)
    location / {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to backup files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;
}