# Fail2Ban Configuration for Calendar Security
# Place in: /etc/fail2ban/jail.d/calendar.conf

[DEFAULT]
# Ban duration (1 hour)
bantime = 3600

# Time window for counting failures
findtime = 600

# Number of failures before ban
maxretry = 5

# Backend for log file monitoring
backend = auto

# Email notifications (optional, configure your email)
# destemail = your-email@example.com
# sender = fail2ban@your-domain.ru
# mta = sendmail
# action = %(action_mwl)s

# Calendar-specific jail
[calendar-nginx-auth]
enabled = true
filter = calendar-nginx-auth
action = iptables[name=CalendarAuth, port=http, protocol=tcp]
logpath = /var/log/nginx/access.log
maxretry = 3
findtime = 300
bantime = 7200

[calendar-nginx-badbots]
enabled = true
filter = calendar-nginx-badbots
action = iptables[name=CalendarBadBots, port=http, protocol=tcp]
logpath = /var/log/nginx/access.log
maxretry = 1
bantime = 86400

[calendar-sqli]
enabled = true
filter = calendar-sqli
action = iptables[name=CalendarSQLi, port=http, protocol=tcp]
logpath = /var/log/nginx/access.log
maxretry = 1
bantime = 604800

[calendar-ddos]
enabled = true
filter = calendar-ddos
action = iptables[name=CalendarDDoS, port=http, protocol=tcp]
logpath = /var/log/nginx/access.log
maxretry = 100
findtime = 60
bantime = 3600

# Custom filters location: /etc/fail2ban/filter.d/