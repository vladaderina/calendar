services:
  calendar:
    image: calendar-app:latest
    container_name: calendar-container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped
    # healthcheck — опционально, чтобы Docker следил за живостью
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
