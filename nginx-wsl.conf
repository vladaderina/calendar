# Nginx Configuration for WSL (with Windows Port Forwarding)
# This config expects Windows to forward ports to this WSL instance

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # UPSTREAM - Calendar app
    upstream calendar_app {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # HTTP - Redirect to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS - Secure Calendar
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name lunxhome.tplinkdns.com;

        # SSL Certificates - Use certbot or self-signed
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.com; frame-ancestors 'none'" always;

        # IP Whitelist - РАЗРЕШЕНО ТОЛЬКО ВАШЕПРЯМОМ IP
        allow 78.29.33.110;
        deny all;

        # SECRET ENDPOINT - ТОЛЬКО ЭТОТ ПУТЬ РАБОТАЕТ
        location /luna-calendar-secure/ {
            rewrite ^/luna-calendar-secure/(.*)$ /$1 break;
            
            proxy_pass http://calendar_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;
            proxy_buffering off;
        }

        # ALL OTHER REQUESTS GET 404
        location / {
            return 404;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
        }
    }

    # 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/calendar;
    }
}