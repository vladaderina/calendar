# Security Headers Middleware
# Add this to your Express server or use as nginx config reference

# Content Security Policy
# Strict policy for maximum security
Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'

# Prevent clickjacking
X-Frame-Options: DENY

# Prevent MIME sniffing
X-Content-Type-Options: nosniff

# XSS Protection
X-XSS-Protection: 1; mode=block

# Referrer Policy
Referrer-Policy: strict-origin-when-cross-origin

# Permissions Policy (disable unnecessary browser features)
Permissions-Policy: accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()

# HSTS (enable HTTPS only)
Strict-Transport-Security: max-age=31536000; includeSubDomains; preload

# DNS Prefetch Control
X-DNS-Prefetch-Control: off

# Feature Policy (legacy, same as Permissions-Policy)
Feature-Policy: accelerometer 'none'; camera 'none'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'